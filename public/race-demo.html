<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#111116"><title>跑得快｜大乱斗试玩</title>
<link rel="stylesheet" href="/game-touch.css"><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#111116;color:#fff;font-family:system-ui,-apple-system,sans-serif;touch-action:none}button{font:inherit;touch-action:manipulation;cursor:pointer}#wrap{width:min(100vw,460px);height:100dvh;margin:auto;position:relative;overflow:hidden;background:#191822}canvas{display:block;width:100%;height:100%}#hud{position:absolute;top:env(safe-area-inset-top);left:0;right:0;padding:15px 16px 0;pointer-events:none}.top{display:flex;justify-content:space-between;gap:7px}.pill{background:#111116d9;border:1px solid #ffffff32;border-radius:15px;padding:8px 10px;font-size:13px;font-weight:800;box-shadow:0 3px 15px #0004}.pink{color:#f8bbd0}#progress{height:8px;border-radius:12px;background:#3c3a42;margin-top:10px;overflow:hidden;border:1px solid #ffffff33}#fill{height:100%;width:0;background:linear-gradient(90deg,#f8bbd0,#fff1a6);transition:width .15s}#message{text-align:center;margin:12px auto 0;width:max-content;max-width:90%;border-radius:14px;background:#15131dcc;border:1px solid #fff2;padding:7px 12px;font-size:13px;transition:opacity .2s}#controls{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom));left:14px;right:14px;display:flex;flex-direction:row-reverse;align-items:end;justify-content:space-between;gap:12px}#action-buttons{display:flex;gap:9px;flex:1;justify-content:flex-start;align-items:end}#action-buttons button{flex:0 1 86px;min-width:0;width:86px;max-width:86px;min-height:63px;font-size:13px;padding:7px 3px}#controls button{border:1px solid #ffffff45;background:#26252ddc;color:#fff;min-height:69px;border-radius:18px;font-weight:900;font-size:15px;box-shadow:0 6px 16px #0005;user-select:none;-webkit-user-select:none}#joystick{width:112px;height:112px;border-radius:50%;background:#302d3ee8;border:2px solid #f8bbd08a;position:relative;touch-action:none;flex-shrink:0;box-shadow:inset 0 0 25px #0006,0 6px 20px #0005}#joystick:before{content:"◀　▶";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#f8bbd090;font-size:12px;letter-spacing:8px;pointer-events:none}#stick{position:absolute;width:51px;height:51px;border-radius:50%;top:50%;left:50%;transform:translate(-50%,-50%);background:radial-gradient(circle at 30% 25%,#ffe5ee,#f8bbd0 68%,#d790ae);box-shadow:0 5px 14px #0008;border:3px solid #fff7;pointer-events:none;transition:transform .08s}#stick.active{transition:none}#joystick-caption{position:absolute;bottom:-14px;left:0;right:0;text-align:center;font-size:10px;color:#f3d7e2;pointer-events:none}#controls .main{background:#f8bbd0;color:#2d1925;border-color:#ffdfeb}#controls .boost{background:#fee39c;color:#2d2611}#controls button:active{transform:scale(.95)}#boosttrack{position:absolute;bottom:calc(148px + env(safe-area-inset-bottom));left:18px;right:18px;display:flex;align-items:center;gap:8px;color:#fffbd0;font-size:12px;font-weight:750}#boostbar{height:9px;flex:1;background:#55505a;border-radius:9px;overflow:hidden}#boostfill{height:100%;width:100%;background:#fee39c}#overlay{position:absolute;inset:0;background:linear-gradient(155deg,#13121bed,#23202cec);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:25px 22px;z-index:4}#overlay.hidden{display:none}.mascot{font-size:83px;filter:drop-shadow(0 10px 15px #0006)}h1{font-size:35px;letter-spacing:1px;margin:11px 0}p{color:#d3d0d6;line-height:1.65;margin:6px 0 16px;font-size:15px}.cta{border:0;background:#f8bbd0;color:#271a24;font-size:19px;font-weight:900;padding:17px 30px;border-radius:17px;width:100%;max-width:300px;box-shadow:0 9px 24px #f8bbd044}.tip{font-size:12px;color:#b1aeb8;margin-top:15px}.tag{color:#f8bbd0;font-weight:800;letter-spacing:2px;font-size:12px}#toast{position:absolute;left:50%;top:27%;transform:translateX(-50%);background:#111e;border:1px solid #ffb9d1;border-radius:14px;padding:12px 18px;font-weight:900;font-size:19px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .16s;z-index:3}#back{position:absolute;top:calc(60px + env(safe-area-inset-top));right:16px;color:#fff8;text-decoration:none;font-size:11px;z-index:1}
</style></head><body><div id="wrap"><canvas class="race-surface" id="game"></canvas>
<div id="hud"><div class="pill">⭐ <b id="solo-stars">0</b> 颗 <span id="solo-gain"></span></div><div class="top"><div class="pill">🏁 <span id="clock">30.0</span>s</div><div class="pill">❤️ <span id="hearts">♥♥♥</span></div><div class="pill pink">第 <span id="place">1</span>/4 名</div></div><div id="progress"><div id="fill"></div></div><div id="message">⭐ 每收集5颗星星自动加速！</div></div>
<a id="back" href="/">返回大厅</a><div id="toast"></div>
<div id="boosttrack">⚡ 加速能量 <div id="boostbar"><div id="boostfill"></div></div></div>
<div class="race-blast" id="solo-blast"></div><div id="controls"><div id="joystick" role="application" aria-label="右侧摇杆左右换道"><div id="stick"></div><span id="joystick-caption">左右换道</span></div><div id="action-buttons"><div class="race-touch"><button id="race-left" aria-label="向左换道">←</button><button id="race-right" aria-label="向右换道">→</button></div><button id="jump" class="main">⬆ 跳跃</button><button id="boost" class="boost">⚡ 加速</button></div></div>
<div id="overlay"><span class="tag">PARTY CLASH · 跑得快</span><div class="mascot">🐰</div><h1>跑得快！</h1><p>30秒动物障碍赛！右侧摇杆左右换道，左侧点跳跃键起跳，按住加速键超车。撞到障碍会减速和扣血，看看你能否跑赢三位动物对手！</p><button class="cta" id="go">▶ 开始试玩</button><div class="tip">手机单人玩法演示 · 电脑模拟3名对手<br>多人联机版已上线，可从大厅进入</div></div>
</div><script src="/race-touch.js"></script><script>
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),$=id=>document.getElementById(id);
let protectedUntil=0;
let W=0,H=0,scale=1,last=0,raf=0,running=false,start=0,t=0,world=0,lane=1,laneVisual=1,health=3,boost=100,jumpUntil=0,stunUntil=0,holdBoost=false,obstacles=[],pickups=[],particles=[],nextSpawn=155,score=0,stars=0,autoBoostUntil=0,noticeUntil=0,finish=false;
const DURATION=30,ROAD=3900;let foes=[];
function resize(){let r=canvas.getBoundingClientRect();W=r.width;H=r.height;scale=Math.min(devicePixelRatio||1,2);canvas.width=Math.floor(W*scale);canvas.height=Math.floor(H*scale);ctx.setTransform(scale,0,0,scale,0,0)}addEventListener('resize',resize);resize();
const rand=(a,b)=>a+Math.random()*(b-a);
function toast(msg){$('toast').textContent=msg;$('toast').style.opacity=1;noticeUntil=performance.now()+900}
function reset(){protectedUntil=0;$('solo-stars').textContent='0';$('solo-gain').textContent='';cancelAnimationFrame(raf);running=true;finish=false;world=0;lane=1;laneVisual=1;health=3;boost=100;jumpUntil=0;stunUntil=0;holdBoost=false;stickReset();obstacles=[];pickups=[];particles=[];nextSpawn=155;score=0;stars=0;autoBoostUntil=0;t=0;start=performance.now();last=start;foes=[{e:'🦊',name:'狐狸',p:0,l:0,s:rand(46,55),phase:1},{e:'🐼',name:'熊猫',p:0,l:2,s:rand(46,55),phase:3},{e:'🐸',name:'青蛙',p:0,l:1,s:rand(46,55),phase:5}];$('overlay').classList.add('hidden');raf=requestAnimationFrame(frame)}
function move(dir){if(!running)return;lane=Math.max(0,Math.min(2,lane+dir))}
const moveLane=delta=>{if(running)lane=Math.max(0,Math.min(2,lane+delta))};
$('race-left').onclick=()=>moveLane(-1);$('race-right').onclick=()=>moveLane(1);
RaceTouch.bind(document.querySelector('canvas'),moveLane,()=>jump());
const joystick=$('joystick'),stick=$('stick');let stickPointer=null,stickStartX=0,stickStartLane=1;
function stickReset(){stickPointer=null;stick.classList.remove('active');stick.style.transform='translate(-50%,-50%)'}
joystick.addEventListener('pointerdown',e=>{if(!running||stickPointer!==null)return;e.preventDefault();stickPointer=e.pointerId;stickStartX=e.clientX;stickStartLane=lane;stick.classList.add('active');try{joystick.setPointerCapture(e.pointerId)}catch{}});
joystick.addEventListener('pointermove',e=>{if(e.pointerId!==stickPointer)return;e.preventDefault();const dx=e.clientX-stickStartX,offset=Math.max(-40,Math.min(40,dx));stick.style.transform='translate(calc(-50% + '+offset+'px),-50%)';lane=Math.max(0,Math.min(2,stickStartLane+Math.round(dx/35)))});
for(const ev of ['pointerup','pointercancel','lostpointercapture'])joystick.addEventListener(ev,e=>{if(e.pointerId===stickPointer)stickReset()});
function jump(){if(!running||t<jumpUntil)return;jumpUntil=t+0.85;toast('⬆ 完美起跳！')}
function isJumping(){return t<jumpUntil}
$('jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});
$('boost').addEventListener('pointerdown',e=>{e.preventDefault();holdBoost=true;try{e.currentTarget.setPointerCapture(e.pointerId)}catch{}});
['pointerup','pointercancel','lostpointercapture'].forEach(ev=>$('boost').addEventListener(ev,()=>holdBoost=false));
addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp',' ','Shift'].includes(e.key))e.preventDefault();if(e.repeat)return;if(e.key==='ArrowLeft'||e.key==='a')move(-1);if(e.key==='ArrowRight'||e.key==='d')move(1);if(e.key==='ArrowUp'||e.key===' ')jump();if(e.key==='Shift')holdBoost=true});
addEventListener('keyup',e=>{if(e.key==='Shift')holdBoost=false});
$('go').onclick=reset;
function spawn(at){const blocked=Math.floor(rand(0,3)),occupied=new Set([blocked]);obstacles.push({p:at,l:blocked,hit:false,kind:'bomb'});if(at>330&&Math.random()<.42){const second=(blocked+1+Math.floor(rand(0,2)))%3;occupied.add(second);obstacles.push({p:at+rand(-5,5),l:second,hit:false,kind:'bomb'})}const free=[0,1,2].filter(l=>!occupied.has(l));const l=free[Math.floor(rand(0,free.length))];pickups.push({p:at+25,l,taken:false});pickups.push({p:at+53,l,taken:false});if(Math.random()<.85){const secondLane=free[Math.floor(rand(0,free.length))];pickups.push({p:at+80,l:secondLane,taken:false})}if(Math.random()<.4){pickups.push({p:at+104,l,taken:false})}}
function particle(x,y,c){for(let i=0;i<14;i++)particles.push({x,y,vx:rand(-3.5,3.5),vy:rand(-4,0),life:rand(.3,.9),c})}
function update(dt){t+=(dt);const autoBoost=t<autoBoostUntil,boosting=(autoBoost||(holdBoost&&boost>0))&&t>=stunUntil;const baseSpeed=72+Math.min(33,t*.74),speed=t<stunUntil?baseSpeed*.56:boosting?baseSpeed+28:baseSpeed;boost=Math.max(0,Math.min(100,boost+(holdBoost&&!autoBoost&&boosting?-32:12)*dt));world+=speed*dt;laneVisual+=(lane-laneVisual)*Math.min(1,dt*13);foes.forEach(f=>{f.p+=(f.s+18+Math.min(33,t*.74)+Math.sin(t*1.2+f.phase)*5)*dt;if(Math.random()<dt*.5)f.l=Math.floor(rand(0,3))});while(world+230>nextSpawn){spawn(nextSpawn);nextSpawn+=rand(100,127)+Math.min(20,t*.3)}for(const o of obstacles){if(!o.hit&&o.p<=world+5&&o.p>=world-12&&o.l===lane){o.hit=true;if(isJumping()){score+=12;toast('✨ 完美闪避 +12')}else if(t>=protectedUntil){health--;stunUntil=t+1.25;protectedUntil=t+1.5;RaceTouch.flash($('solo-blast'));$('hearts').textContent='♥'.repeat(health)+'♡'.repeat(3-health);particle(W/2,H*.74,'#f8bbd0');toast('💥 撞到了！-1生命');if(health<=0){end();return}}}else if(!o.hit&&o.p<world-12){o.hit=true;score+=3}}for(const p of pickups){if(!p.taken&&p.p<world+5&&p.p>world-13&&p.l===lane){p.taken=true;stars++;$('solo-stars').textContent=stars;RaceTouch.gain($('solo-gain'),1);boost=Math.min(100,boost+10);score+=20;if(stars%5===0){autoBoostUntil=Math.max(autoBoostUntil,t)+2.5;toast('🔥 5颗星星！自动喷火加速！')}else{toast('⭐ '+(stars%5)+'/5 · 再收集星星自动加速')}}}obstacles=obstacles.filter(o=>o.p>world-40);pickups=pickups.filter(p=>p.p>world-40);particles=particles.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.18;p.life-=dt;return p.life>0});$('clock').textContent=Math.max(0,DURATION-t).toFixed(1);$('message').textContent=t<12?'初级速度 · 注意前方炸弹':t<27?'⚡ 加速阶段！小心炸弹':'🔥 极速阶段！保持专注！';$('hearts').textContent='♥'.repeat(health)+'♡'.repeat(3-health);$('boostfill').style.width=boost+'%';$('fill').style.width=(Math.min(100,world/ROAD*100))+'%';$('place').textContent=1+foes.filter(f=>f.p>world).length;if(performance.now()>noticeUntil)$('toast').style.opacity=0;if(t>=DURATION||world>=ROAD)end()}
function rounded(x,y,w,h,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function draw(){ctx.clearRect(0,0,W,H);let horizon=H*.22,foot=H*.92;const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#201c30');sky.addColorStop(.43,'#40304b');sky.addColorStop(1,'#18191a');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);ctx.fillStyle='#283b2e';ctx.fillRect(0,horizon,W,H-horizon);for(let j=0;j<11;j++){const x=(j*73+19)%W;ctx.fillStyle=j%2?'#234637':'#315044';ctx.beginPath();ctx.arc(x,horizon+Math.sin(j)*17,23+((j*7)%19),0,Math.PI*2);ctx.fill()}const leftTop=W*.32,rightTop=W*.68,leftBot=0,rightBot=W;ctx.fillStyle='#514a51';ctx.beginPath();ctx.moveTo(leftTop,horizon);ctx.lineTo(rightTop,horizon);ctx.lineTo(rightBot,foot);ctx.lineTo(leftBot,foot);ctx.closePath();ctx.fill();ctx.strokeStyle='#f8bbd0';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(leftTop,horizon);ctx.lineTo(leftBot,foot);ctx.moveTo(rightTop,horizon);ctx.lineTo(rightBot,foot);ctx.stroke();function coord(l,p){const z=Math.max(0,Math.min(1,(p-world)/235));const k=1-z,depth=Math.pow(k,1.35);const y=horizon+(foot-horizon)*depth;const width=(rightTop-leftTop)*(1-depth)+(rightBot-leftBot)*depth;return {x:W/2+(l-1)*width/3,y,size:Math.max(.18,1.2*depth)}}for(let ln=1;ln<=2;ln++){ctx.strokeStyle='#ffebbb6b';ctx.lineWidth=3;ctx.setLineDash([20,22]);ctx.beginPath();ctx.moveTo(W/2+(ln/3-.5)*(rightTop-leftTop),horizon);ctx.lineTo(W/2+(ln/3-.5)*(rightBot-leftBot),foot);ctx.stroke();ctx.setLineDash([])}for(let d=0;d<12;d++){let p=Math.floor(world/30)*30+d*30,z=coord(1,p);if(z.y<horizon+5)continue;ctx.globalAlpha=.18+z.size*.2;ctx.strokeStyle='#fff';ctx.lineWidth=z.size*2;ctx.beginPath();ctx.moveTo(W/2-(W*.65)*z.size,z.y);ctx.lineTo(W/2+(W*.65)*z.size,z.y);ctx.stroke();ctx.globalAlpha=1}const stuff=[];obstacles.forEach(o=>{if(o.p>world-15&&o.p<world+240)stuff.push({...coord(o.l,o.p),type:o.kind})});pickups.forEach(p=>{if(!p.taken&&p.p>world-15&&p.p<world+240)stuff.push({...coord(p.l,p.p),type:'star'})});foes.forEach(f=>{if(f.p>world-30&&f.p<world+210){const loc=coord(f.l,f.p);stuff.push({...loc,type:'foe',emoji:f.e,name:f.name})}});stuff.sort((a,b)=>a.size-b.size);for(const a of stuff){ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=(a.type==='foe'?38:a.type==='bomb'?61:a.type==='star'?47:a.type==='puddle'?49:34)*a.size+'px system-ui';if(a.type==='bomb'){ctx.fillText('💣',a.x,a.y-10*a.size)}else if(a.type==='puddle'){ctx.fillText('🕳️',a.x,a.y)}else if(a.type==='star'){ctx.fillText('⭐',a.x,a.y-12*a.size)}else{ctx.fillText(a.emoji,a.x,a.y-19*a.size);ctx.fillStyle='#fff';ctx.font=Math.max(9,12*a.size)+'px system-ui';ctx.fillText(a.name,a.x,a.y-50*a.size)}}const player=coord(laneVisual,world);const bob=Math.sin(t*12)*3,jheight=isJumping()?55*Math.sin(Math.PI*(jumpUntil-t)/.85):0;ctx.fillStyle='#0007';ctx.beginPath();ctx.ellipse(player.x,foot-13,27,9,0,0,Math.PI*2);ctx.fill();ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='62px system-ui';if((t<autoBoostUntil||(holdBoost&&boost>0))&&t>=stunUntil){ctx.save();ctx.translate(player.x,foot-30-jheight);for(let i=0;i<3;i++){const flicker=8*Math.sin(t*29+i*2.3);ctx.globalAlpha=.85;ctx.fillStyle=i===0?'#ff582a':i===1?'#ffb22f':'#fff0a3';ctx.beginPath();ctx.moveTo(-12+i*8,-6);ctx.quadraticCurveTo(-18+i*12,18+flicker,-6+i*9,36+flicker);ctx.quadraticCurveTo(7+i*5,14,10+i*6,-6);ctx.closePath();ctx.fill()}ctx.globalAlpha=1;ctx.restore();for(let i=0;i<4;i++){const fx=player.x+Math.sin(t*27+i*4)*20,fy=foot-10+((t*82+i*22)%60);ctx.fillStyle=['#ff6a27','#ffb33f','#fff3a4','#ff923d'][i];ctx.beginPath();ctx.arc(fx,fy,2+i%2,0,Math.PI*2);ctx.fill()}}const turn=Math.max(-1,Math.min(1,(lane-laneVisual)*2.3));ctx.save();ctx.translate(player.x,foot-58+bob-jheight);ctx.rotate(turn*.28);ctx.fillText('🐰',0,0);ctx.restore();if(isJumping()){ctx.strokeStyle='#ffed9d';ctx.lineWidth=5;ctx.beginPath();ctx.arc(player.x,foot-64+bob-jheight,37,Math.PI,Math.PI*2);ctx.stroke()}if(t<stunUntil){rounded(W/2-70,H*.56,140,34,10,'#9d345cb9');ctx.fillStyle='white';ctx.font='bold 15px system-ui';ctx.fillText('💥 减速中',W/2,H*.56+17)}for(const p of particles){ctx.fillStyle=p.c;ctx.globalAlpha=Math.min(1,p.life*2);ctx.fillRect(p.x,p.y,6,6)}ctx.globalAlpha=1;ctx.font='bold 14px system-ui';ctx.fillStyle='#fff';ctx.fillText('🐰 你',player.x,foot-117-jheight)}
function end(){if(finish)return;finish=true;running=false;holdBoost=false;cancelAnimationFrame(raf);const rank=1+foes.filter(f=>f.p>world).length;const title=rank===1?'🏆 你是冠军！':health===0?'💥 挑战结束！':'🏁 跑完啦！';$('overlay').classList.remove('hidden');$('overlay').innerHTML='<span class="tag">PARTY CLASH · 跑得快</span><div class="mascot">'+(rank===1?'🏆':'🐰')+'</div><h1>'+title+'</h1><p>你的名次：第 '+rank+' / 4 名<br>跑过距离：'+Math.floor(world)+' 米 · 奖励分：'+score+'<br>收集星星：'+stars+' 颗<br>撞击次数：'+(3-health)+'</p><button class="cta" id="again">↻ 再玩一次</button><div class="tip">这是单人试玩版，其他三位动物为电脑对手。</div>';$('again').onclick=reset}
function frame(now){let dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;if(running)update(dt);draw();if(running)raf=requestAnimationFrame(frame)}
draw();
})();
</script></body></html>
