<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#130d29">
  <title>跑得快｜大乱斗</title>
  <style>html,body{margin:0;background:#171323;color:#fbe6ef;font:16px system-ui}#game{position:relative}#scene,#effect,.light-scene{position:absolute;inset:0}:where(#intro){position:relative;padding:16px}a{color:#ffc6e2}[hidden]{display:none!important}</style>
  <link rel="stylesheet" media="print" onload="this.media='all'" href="/game-touch.css"><link rel="stylesheet" media="print" onload="this.media='all'" href="./style.css">
  <script type="module" src="./game.mjs?v=race-center-1"></script>
</head>
<body>
  <main id="game">
    <canvas id="scene" aria-label="霓虹城市中的三维跑道"></canvas>
    <div id="hud" hidden>
      <span id="health" aria-label="生命 3">❤️❤️❤️</span>
      <span>⭐ <b id="stars">0</b></span>
      <span>⏱ <b id="time">45</b> 秒</span>
      <span id="rank" hidden></span>
      <button id="boost" type="button" hidden>加速</button>
      <button id="pause" type="button" aria-label="暂停">Ⅱ</button>
    </div>
    <div id="nameplates" hidden></div>
    <details id="room-leaderboard" hidden><summary>排行榜</summary><ol id="room-leaderboard-list"></ol></details>
    <p id="orientation-calibration" hidden role="status">屏幕已旋转，请保持握姿，正在重新校准…</p>
    <p id="room-status" hidden role="status"></p>
    <div id="effect" aria-hidden="true" data-kind=""></div>
    <div id="pickup" aria-hidden="true">+1 ⭐</div>
    <div id="controls" hidden aria-label="触控操作">
      <button id="left" type="button" aria-label="向左移动">←</button>
      <button id="jump" type="button">跳跃</button>
      <button id="right" type="button" aria-label="向右移动">→</button>
    </div>
    <section id="intro" class="sheet">
      <h1>跑得快</h1>
      <p>左倾向左，右倾向右，回正停止。向上滑动跳跃。</p>
      <p id="mode">开始时自动校准；无感应器时可用触控方向键。</p>
      <div class="settings">
        <label id="solo-character-label">角色 <select id="solo-character"></select></label>
        <label>灵敏度 <select id="sensitivity"><option value="low">低</option><option value="medium" selected>中</option><option value="high">高</option></select></label>
      </div>
      <button id="start" class="primary" type="button" disabled>开始游戏</button>
      <a href="/">返回大厅</a>
    </section>
    <section id="paused" class="sheet compact" hidden>
      <h2>游戏暂停</h2>
      <p>自然握住手机后重新校准。左倾向左，右倾向右；无感应器时用左右键。</p>
      <p id="calibration-status" role="status"></p>
      <button id="recalibrate" type="button">重新校准</button>
      <button id="resume" class="primary" type="button">继续游戏</button>
      <p id="race-paused-status" hidden>比赛照常进行。</p>
      <button id="reset" type="button">返回设置</button>
    </section>
    <section id="result" class="sheet compact" hidden>
      <h2>游戏结束</h2>
      <div>跑过距离</div><strong id="final-distance" class="round-primary"></strong><div id="final-score"></div><p id="final-stars"></p>
      <p id="survival"></p>
      <div class="settings">
        <button id="again" class="primary" type="button">再玩一次</button>
        <button id="back" type="button">返回</button>
      </div>
    </section>
    <section id="error" class="sheet compact" hidden role="alert">
      <h2>无法启动 3D 游戏</h2>
      <p id="error-message"></p>
      <a href="/race-demo.html">打开原版跑得快</a>
    </section>
  </main>
</body>
</html>
