<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#130d29">
  <title>跑得快｜大乱斗</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./game.mjs"></script>
</head>
<body>
  <main id="game">
    <canvas id="scene" aria-label="霓虹城市中的三维跑道"></canvas>
    <div id="hud" hidden>
      <span id="health" aria-label="生命 3">❤️❤️❤️</span>
      <span>⭐ <b id="stars">0</b></span>
      <span>⏱ <b id="time">45</b> 秒</span>
      <button id="pause" type="button" aria-label="暂停">Ⅱ</button>
    </div>
    <div id="effect" aria-hidden="true" data-kind=""></div>
    <div id="pickup" aria-hidden="true">+1 ⭐</div>
    <div id="controls" hidden aria-label="触控操作">
      <button id="left" type="button" aria-label="向左移动">←</button>
      <button id="jump" type="button">跳跃</button>
      <button id="right" type="button" aria-label="向右移动">→</button>
    </div>
    <section id="intro" class="sheet">
      <h1>跑得快</h1>
      <p>左右倾斜手机移动，向上滑动跳跃</p>
      <p id="mode" role="status">当前使用触控操作</p>
      <div class="settings">
        <button id="calibrate" type="button">校准重力感应</button>
        <label>灵敏度 <select id="sensitivity"><option value="low">低</option><option value="medium" selected>中</option><option value="high">高</option></select></label>
      </div>
      <button id="start" class="primary" type="button" disabled>开始游戏</button>
      <a href="/">返回大厅</a>
    </section>
    <section id="paused" class="sheet compact" hidden>
      <h2>游戏暂停</h2>
      <button id="resume" class="primary" type="button">继续游戏</button>
      <button id="reset" type="button">返回设置</button>
    </section>
    <section id="result" class="sheet compact" hidden>
      <h2>游戏结束</h2>
      <p id="final-stars"></p>
      <p id="survival"></p>
      <div class="settings">
        <button id="again" class="primary" type="button">再玩一次</button>
        <button id="back" type="button">返回</button>
      </div>
    </section>
    <section id="error" class="sheet compact" hidden role="alert">
      <h2>无法启动 3D 游戏</h2>
      <p id="error-message"></p>
      <a href="/race-demo.html">打开原版跑得快</a>
    </section>
  </main>
</body>
</html>
