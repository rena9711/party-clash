<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#090e1b"><title>贪吃蛇｜横屏360°摇杆试玩</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#080c19;color:#fff;font:14px system-ui,-apple-system,"PingFang SC",sans-serif;overscroll-behavior:none}button{font:inherit;cursor:pointer}#game{position:relative;width:100vw;height:100dvh;overflow:hidden;touch-action:none;background:#080c19}canvas{width:100%;height:100%;display:block}#hud{position:absolute;top:max(10px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));display:flex;gap:8px;align-items:flex-start;justify-content:space-between;pointer-events:none}.title{padding:8px 13px;background:#101628dc;border:1px solid #8659a57c;border-radius:14px;box-shadow:0 0 15px #8843a829;font-size:17px;font-weight:900;text-shadow:0 0 10px #f57bdc96}.title b{color:#ffb2ed}.title small{font-size:10px;font-weight:400;color:#c5bedb;display:block;margin-top:4px}.stats{display:flex;gap:7px}.stat{text-align:center;min-width:76px;border:1px solid #7268a079;border-radius:14px;background:#101628e8;padding:7px 12px}.stat small{display:block;color:#b8bcd4;font-size:10px}.stat strong{font-size:19px;color:#f3d8ff;font-variant-numeric:tabular-nums}.stat:first-child strong{color:#61eafa}.stat:nth-child(2) strong{color:#ffe074}.stat:nth-child(3) strong{color:#d3a0ff}
#leader{position:absolute;top:80px;left:max(12px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:4px;pointer-events:none}.leader-row{display:flex;align-items:center;gap:6px;min-width:117px;padding:4px 9px;background:#101626b8;border:1px solid #ffffff18;border-radius:12px;font-size:11px}.leader-row.me{border-color:#fb88d7a6}.swatch{width:9px;height:9px;border-radius:50%;box-shadow:0 0 8px currentColor}.leader-row span:last-child{margin-left:auto;font-weight:700}
#stick{position:absolute;left:max(20px,env(safe-area-inset-left));bottom:max(14px,env(safe-area-inset-bottom));height:146px;width:146px;border-radius:50%;background:radial-gradient(circle,#363e6680,#3a3d5670 50%,#111b2a9c 70%);border:3px solid #ada7dc85;box-shadow:inset 0 0 24px #bcaaff57,0 0 25px #a88fff3b;touch-action:none;user-select:none;-webkit-user-select:none}.stick-cross{position:absolute;inset:18px;display:grid;place-items:center;color:#d7ceff88;font-size:65px;pointer-events:none}.knob{position:absolute;left:50%;top:50%;width:67px;height:67px;margin:-33.5px 0 0 -33.5px;border-radius:50%;background:radial-gradient(circle at 31% 28%,#fff,#c3b7ff 48%,#7d76bf);border:2px solid #f3ecff;box-shadow:0 0 22px #aea0ff9c;pointer-events:none;display:grid;place-items:center;color:#61589a;font-size:18px}
#right{position:absolute;bottom:max(20px,env(safe-area-inset-bottom));right:max(20px,env(safe-area-inset-right));display:flex;flex-direction:column;align-items:center;gap:9px}.round-btn{height:58px;min-width:90px;border-radius:30px;color:#f7e8ff;background:#26213fdc;border:2px solid #aa8ad5ab;box-shadow:0 0 14px #a05cd83b;font-weight:800}.round-btn:active{background:#655192}#hint{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);color:#d7c5e7cf;font-size:10px;text-align:center;pointer-events:none;white-space:nowrap}
#overlay{position:absolute;inset:0;background:#070b17cb;display:grid;place-items:center;z-index:5;padding:16px}#overlay.hide{display:none}.modal{max-width:440px;width:min(92vw,440px);text-align:center;background:radial-gradient(circle at top right,#513062,#161a31 68%);border:1px solid #bc80de8a;border-radius:22px;padding:18px 24px;box-shadow:0 18px 65px #000c}.modal .mascot{font-size:50px}.modal h1{font-size:25px;margin:4px 0 9px}.modal p{color:#d4cee5;font-size:13px;line-height:1.7;margin:0 0 12px}.action{background:linear-gradient(100deg,#fb9cdd,#b2a5fa);border:0;border-radius:14px;color:#281a32;padding:11px 27px;font-size:16px;font-weight:900}.modal small{display:block;color:#aeabc2;margin-top:9px;font-size:10px}#rotate{position:absolute;inset:0;z-index:9;display:none;place-items:center;text-align:center;background:#090e1bf5;padding:25px}.rotate-icon{font-size:56px}.rotate-title{font-size:22px;font-weight:900;margin:9px}.rotate-desc{font-size:13px;color:#cfbfdc;line-height:1.7;margin-bottom:12px}
@media(orientation:portrait){#rotate{display:grid}}@media(max-height:440px){#hud{top:5px}.title{font-size:13px;padding:5px 8px}.title small{display:none}.stat{min-width:60px;padding:4px 8px}.stat strong{font-size:15px}#leader{top:48px}.leader-row{font-size:10px;padding:2px 6px}#stick{width:118px;height:118px}.knob{width:58px;height:58px;margin:-29px 0 0 -29px}.round-btn{height:48px;min-width:75px}.modal{padding:11px 15px}.modal .mascot{font-size:30px}.modal h1{font-size:21px}.modal p{font-size:11px}}
</style></head><body><main id="game"><canvas id="board" aria-label="贪吃蛇游戏区域"></canvas>
<div id="hud"><div class="title">🐍 <b>贪吃蛇</b><small>360°摇杆 · 横屏试玩版</small></div><div class="stats"><div class="stat"><small>剩余时间</small><strong id="time">60.0s</strong></div><div class="stat"><small>我的积分</small><strong id="score">0</strong></div><div class="stat"><small>当前排名</small><strong id="rank">1/4</strong></div></div></div>
<div id="leader"></div><div id="stick" aria-label="360度虚拟摇杆"><span class="stick-cross">✧</span><span id="knob" class="knob">●</span></div><div id="right"><button id="reset" class="round-btn">↻ 重开</button></div><div id="hint">左手摇杆任意方向转弯 · 自动前进 · 食物 +10 分</div>
<div id="overlay"><div class="modal" id="modal"><div class="mascot">🐍✨</div><h1>贪吃蛇 · 横屏对战</h1><p>左手拖动 <b>360° 摇杆</b>，蛇会平滑转弯，不再局限上下左右。慢速移动、食物加分、碰撞后2秒重生。60秒同地图挑战3条电脑蛇。</p><button class="action" id="start">▶ 开始试玩</button><small>独立测试版 · 暂不加入正式大厅</small></div></div>
<div id="rotate"><div><div class="rotate-icon">📱↻</div><div class="rotate-title">请横向握住手机</div><div class="rotate-desc">这个版本为横屏设计<br>转动手机并关闭竖屏锁定即可试玩</div><button id="fullscreen" class="action">尝试全屏横屏</button></div></div>
</main>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id),cv=$('board'),ctx=cv.getContext('2d'),W=106,H=62,DURATION=60;
const colors=['#ff85d6','#44d9f2','#ffcf53','#7deb80'],names=['我','闪电小蓝','阳光小黄','青草小绿'];
const rand=(a,b)=>a+Math.random()*(b-a),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),wrap=a=>Math.atan2(Math.sin(a),Math.cos(a));
let snakes=[],foods=[],elapsed=0,playing=false,last=0,raf=0,desired=null,joyPointer=null;
const stepSpeed=9.6,turnRate=3.25,collisionRadius=.85;
function snake(i){return {id:i,name:names[i],color:colors[i],angle:rand(-Math.PI,Math.PI),target:rand(-Math.PI,Math.PI),head:{x:rand(19,W-19),y:rand(13,H-13)},trail:[],score:0,eaten:0,deaths:0,respawn:0,shield:1.15,acc:0}}
function spawn(s){for(let j=0;j<80;j++){const head={x:rand(13,W-13),y:rand(10,H-10)};if(snakes.some(p=>p!==s&&p.trail.some((q,i)=>i%5===0&&dist(q,head)<4)))continue;s.head=head;s.angle=rand(-Math.PI,Math.PI);s.target=s.angle;s.trail=[];for(let n=0;n<32;n++)s.trail.push({x:head.x-Math.cos(s.angle)*n*.40,y:head.y-Math.sin(s.angle)*n*.40});s.respawn=0;s.shield=elapsed+1.3;return} s.respawn=elapsed+.5}
function food(){for(let t=0;t<80;t++){const f={x:rand(3,W-3),y:rand(3,H-3),r:rand(.78,1.10),color:['#ffe365','#69edff','#ff81e4','#bf89ff'][Math.floor(rand(0,4))]};if(snakes.some(s=>s.trail.some((p,i)=>i%5===0&&dist(p,f)<2.1)))continue;foods.push(f);return}}
function reset(){cancelAnimationFrame(raf);elapsed=0;snakes=colors.map((_,i)=>snake(i));snakes.forEach(spawn);foods=[];for(let i=0;i<64;i++)food();playing=true;last=performance.now();$('overlay').classList.add('hide');draw();raf=requestAnimationFrame(frame)}
function kill(s){s.trail=[];s.respawn=elapsed+2;s.deaths++;s.score=Math.max(0,s.score-10);if(s.id===0&&navigator.vibrate)navigator.vibrate(45)}
function tick(dt){elapsed+=dt;
for(const s of snakes){if(!s.trail.length){if(s.respawn>0&&elapsed>=s.respawn)spawn(s);continue}
if(s.id===0){if(desired!==null)s.target=desired}else{
 const others=snakes.filter(p=>p.id!==s.id&&p.trail.length);
 let near=foods.reduce((best,f)=>!best||dist(f,s.head)<dist(best,s.head)?f:best,null);
 let avoid=null;if(s.head.x<8||s.head.x>W-8||s.head.y<8||s.head.y>H-8)avoid={x:W/2,y:H/2};
 for(const p of others){for(let k=0;k<p.trail.length;k+=10){if(dist(p.trail[k],s.head)<6){avoid={x:s.head.x+(s.head.x-p.trail[k].x)*3,y:s.head.y+(s.head.y-p.trail[k].y)*3};break}}if(avoid)break}
 const goal=avoid||near||{x:W/2,y:H/2};s.target=Math.atan2(goal.y-s.head.y,goal.x-s.head.x)
}
const difference=wrap(s.target-s.angle),maxTurn=turnRate*dt;s.angle+=Math.max(-maxTurn,Math.min(maxTurn,difference));
const nx=s.head.x+Math.cos(s.angle)*stepSpeed*dt,ny=s.head.y+Math.sin(s.angle)*stepSpeed*dt;
if(nx<1.2||nx>W-1.2||ny<1.2||ny>H-1.2){if(elapsed>=s.shield){kill(s);continue}else{s.target=Math.atan2(H/2-s.head.y,W/2-s.head.x);continue}}
const next={x:nx,y:ny};
let crashed=false,killer=null;if(elapsed>=s.shield){for(const other of snakes){if(!other.trail.length)continue;const start=other===s?24:10;for(let k=start;k<other.trail.length;k+=3){if(dist(next,other.trail[k])<collisionRadius*1.5){crashed=true;killer=other;break}}if(crashed)break}}
if(crashed){kill(s);if(killer&&killer!==s)killer.score+=20;continue}
s.head=next;s.acc+=stepSpeed*dt;while(s.acc>.38){s.acc-=.38;const first=s.trail[0]||next;s.trail.unshift({x:first.x+Math.cos(s.angle)*.38,y:first.y+Math.sin(s.angle)*.38})}
s.trail[0]={x:next.x,y:next.y};const maxLength=32+s.eaten*3;while(s.trail.length>maxLength)s.trail.pop();
for(let i=foods.length-1;i>=0;i--){if(dist(next,foods[i])<1.9){foods.splice(i,1);s.score+=10;s.eaten++;food();if(s.id===0&&navigator.vibrate)navigator.vibrate(13)}}
}
}
function draw(){
const w=cv.clientWidth,h=cv.clientHeight,dpr=Math.min(2,window.devicePixelRatio||1);
if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr)}
ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);
const bg=ctx.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#101729');bg.addColorStop(.7,'#09101e');bg.addColorStop(1,'#160e24');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
ctx.strokeStyle='#24456a37';ctx.lineWidth=.11;for(let y=0;y<H+3;y+=3.8){for(let x=0;x<W+4;x+=7.8){const ox=x+((Math.round(y/3.8)%2)*3.9);ctx.beginPath();for(let i=0;i<6;i++){const a=i*Math.PI/3,px=ox+2.5*Math.cos(a),py=y+2.5*Math.sin(a);if(!i)ctx.moveTo(px,py);else ctx.lineTo(px,py)}ctx.closePath();ctx.stroke()}}
for(const f of foods){ctx.save();ctx.fillStyle=f.color;ctx.globalAlpha=.13;ctx.beginPath();ctx.arc(f.x,f.y,f.r*2.5,0,Math.PI*2);ctx.fill();ctx.globalAlpha=.27;ctx.beginPath();ctx.arc(f.x,f.y,f.r*1.7,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffffffb9';ctx.beginPath();ctx.arc(f.x-f.r*.27,f.y-f.r*.24,f.r*.24,0,Math.PI*2);ctx.fill();ctx.restore()}
for(const s of snakes){if(!s.trail.length)continue;ctx.save();ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=s.color;
ctx.globalAlpha=.18;ctx.lineWidth=3.6;ctx.beginPath();for(let i=s.trail.length-1;i>=0;i--){const p=s.trail[i];if(i===s.trail.length-1)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y)}ctx.stroke();
ctx.globalAlpha=1;ctx.lineWidth=2.05;ctx.stroke();
ctx.fillStyle=s.color;ctx.beginPath();ctx.arc(s.head.x,s.head.y,1.43,0,Math.PI*2);ctx.fill();
const dx=Math.cos(s.angle),dy=Math.sin(s.angle),sx=-dy,sy=dx;for(const k of [-1,1]){const ex=s.head.x+dx*.65+sx*k*.57,ey=s.head.y+dy*.65+sy*k*.57;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ex,ey,.39,0,Math.PI*2);ctx.fill();ctx.fillStyle='#181c28';ctx.beginPath();ctx.arc(ex+dx*.12,ey+dy*.12,.18,0,Math.PI*2);ctx.fill()}
if(elapsed<s.shield){ctx.strokeStyle='#fff9';ctx.lineWidth=.13;ctx.beginPath();ctx.arc(s.head.x,s.head.y,1.7,0,Math.PI*2);ctx.stroke()}
ctx.font='2.0px system-ui';ctx.textAlign='center';ctx.fillStyle='#ffe1fb';ctx.fillText(s.name,s.head.x,s.head.y-2.5);ctx.restore()}
$('time').textContent=Math.max(0,DURATION-elapsed).toFixed(1)+'s';$('score').textContent=snakes[0]?.score||0;
const ranked=[...snakes].sort((a,b)=>b.score-a.score||a.deaths-b.deaths);$('rank').textContent=(ranked.indexOf(snakes[0])+1)+'/4';
$('leader').innerHTML=ranked.map((s,i)=>'<div class="leader-row '+(s.id===0?'me':'')+'"><span>'+(i+1)+'</span><i class="swatch" style="background:'+s.color+';color:'+s.color+'"></i><span>'+s.name+'</span><span>'+s.score+'</span></div>').join('');
}
function frame(t){if(!playing)return;const dt=Math.min(.05,Math.max(0,(t-last)/1000));last=t;tick(dt);draw();if(elapsed>=DURATION){playing=false;const ranked=[...snakes].sort((a,b)=>b.score-a.score||a.deaths-b.deaths),you=snakes[0],rank=ranked.indexOf(you)+1;$('overlay').classList.remove('hide');$('modal').innerHTML='<div class="mascot">'+(rank===1?'🏆':'🐍')+'</div><h1>60秒挑战结束！</h1><p>你的排名：第 '+rank+' / 4 名<br>总积分：'+you.score+' 分 · 吃豆：'+you.eaten+' 颗 · 碰撞：'+you.deaths+' 次</p><button class="action" id="start">↻ 再玩一次</button><small>独立试玩 · 暂未开放真人联机</small>';$('start').onclick=reset;return}raf=requestAnimationFrame(frame)}
const stick=$('stick'),knob=$('knob');let point=null,cx=0,cy=0;function steer(e){if(point!==e.pointerId)return;e.preventDefault();const dx=e.clientX-cx,dy=e.clientY-cy,d=Math.hypot(dx,dy),r=43;knob.style.transform='translate('+dx/Math.max(1,d)*Math.min(r,d)+'px,'+dy/Math.max(1,d)*Math.min(r,d)+'px)';if(d>10)desired=Math.atan2(dy,dx)}
stick.addEventListener('pointerdown',e=>{point=e.pointerId;const rc=stick.getBoundingClientRect();cx=rc.left+rc.width/2;cy=rc.top+rc.height/2;try{stick.setPointerCapture(point)}catch{}steer(e)});
stick.addEventListener('pointermove',steer);for(const event of ['pointerup','pointercancel','lostpointercapture'])stick.addEventListener(event,e=>{if(e.pointerId!==point)return;point=null;knob.style.transform='translate(0,0)';desired=null});
document.addEventListener('keydown',e=>{const keys={ArrowUp:-Math.PI/2,w:-Math.PI/2,ArrowDown:Math.PI/2,s:Math.PI/2,ArrowLeft:Math.PI,a:Math.PI,ArrowRight:0,d:0};if(Object.prototype.hasOwnProperty.call(keys,e.key)){e.preventDefault();desired=keys[e.key]}});
document.addEventListener('keyup',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d'].includes(e.key))desired=null});
$('start').onclick=reset;$('reset').onclick=reset;$('fullscreen').onclick=async()=>{try{await document.documentElement.requestFullscreen?.();await screen.orientation?.lock?.('landscape')}catch(e){}};
snakes=colors.map((_,i)=>snake(i));draw();
})();
</script></body></html>
