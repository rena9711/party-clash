<body><main id="app"><div class="top"><div class="brand">🐍 <em>贪吃蛇</em> <span style="font-size:11px;font-weight:400">PARTY CLASH</span></div><span class="beta">霓虹版 · 独立试玩</span></div><div class="desc">60秒竞技 · 霓虹光点 +10分 · 撞击后2秒重生</div><div class="hud"><div class="stat"><small>⏱ 剩余时间</small><b id="time">60.0s</b></div><div class="stat"><small>⭐ 我的积分</small><b id="score">0</b></div><div class="stat"><small>🏆 当前排名</small><b id="rank">1 / 4</b></div></div><div id="leaders" class="scoreboard"></div><div class="board-box"><div class="board-wrap"><canvas id="board"></canvas><div class="overlay" id="overlay"><div class="modal" id="modal"><div class="mascot">🐍</div><h1>贪吃蛇大乱斗</h1><p>60 秒同图混战！拖动右下角摇杆改变方向，吃到豆子加 10 分。撞墙、撞到自己或其他蛇会死亡，<b>2 秒后自动重生</b>，分数保留（每次死亡扣 10 分）。</p><button class="action" id="start">▶ 开始试玩</button><small>当前为单人操控 + 3 条电脑蛇。多人联机版待你确认玩法后再加入首页。</small></div></div></div></div><div id="status" class="status">移动摇杆改变方向，收集发光豆豆</div><div class="controls"><div class="guide"><b>🎮 四方向按键</b><div>轻触方向键控制转向</div><div>吃豆变长 · 避免撞击</div><small>电脑也可以用方向键 / WASD</small><div style="margin-top:12px"><button id="restart" class="tiny-btn">↻ 重新开始</button></div></div><div class="dpad" role="group" aria-label="贪吃蛇方向控制"><button type="button" class="dir-btn dir-up" data-dir="up" aria-label="向上">▲</button><button type="button" class="dir-btn dir-left" data-dir="left" aria-label="向左">◀</button><span class="dir-center" aria-hidden="true">✦</span><button type="button" class="dir-btn dir-right" data-dir="right" aria-label="向右">▶</button><button type="button" class="dir-btn dir-down" data-dir="down" aria-label="向下">▼</button></div></div><div class="foot"><span>霓虹UI预览 · 3条电脑蛇模拟对战</span><a href="/">返回大厅</a></div></main>
<script>
(()=>{
'use strict';
const W=24,H=32,ROUND=60,STEP=.15,FOODS=19;
const q=id=>document.getElementById(id),canvas=q('board'),ctx=canvas.getContext('2d');
const colors=['#ff77ca','#ffd34c','#39d9ed','#74f96d'],names=['你','黄蛇','绿蛇','紫蛇'];
let snakes=[],foods=[],running=false,last=0,elapsed=0,acc=0,raf=0,message='',messageUntil=0,seed=0;
const rand=n=>Math.floor(Math.random()*n),equal=(a,b)=>a.x===b.x&&a.y===b.y,dirs=[{x:1,y:0},{x:0,y:1},{x:-1,y:0},{x:0,y:-1}];
function occupied(c){return snakes.some(s=>s.body.some(p=>equal(p,c)))}
function spawnFood(){for(let n=0;n<150;n++){const c={x:rand(W),y:rand(H)};if(!occupied(c)&&!foods.some(f=>equal(f,c))){foods.push(c);return}}}
function spawn(s){for(let n=0;n<150;n++){const d=dirs[rand(4)],x=4+rand(W-8),y=4+rand(H-8);const body=Array.from({length:4},(_,i)=>({x:x-d.x*i,y:y-d.y*i}));if(body.every(p=>p.x>=0&&p.y>=0&&p.x<W&&p.y<H&&!occupied(p))){s.body=body;s.dir=d;s.next=null;s.respawn=0;s.protected=elapsed+1.1;return}}s.respawn=elapsed+.4}
function announce(t){message=t;messageUntil=elapsed+1.1;q('status').textContent=t}
function reset(){cancelAnimationFrame(raf);snakes=colors.map((color,i)=>({name:names[i],color,body:[],dir:dirs[i],next:null,score:0,food:0,deaths:0,respawn:0,protected:0}));foods=[];elapsed=0;acc=0;running=true;last=performance.now();snakes.forEach(spawn);while(foods.length<FOODS)spawnFood();q('overlay').classList.add('hidden');announce('🎮 开始！吃豆得分，避开蛇身');refreshHud();raf=requestAnimationFrame(frame)}
function chooseAI(s){if(!s.body.length)return;const head=s.body[0];let options=dirs.filter(d=>d.x!==-s.dir.x||d.y!==-s.dir.y);const canGo=d=>{const x=head.x+d.x,y=head.y+d.y;if(x<0||x>=W||y<0||y>=H)return false;return !snakes.some(p=>p.body.some((b,i)=>b.x===x&&b.y===y&&(p!==s||i<p.body.length-1)))};let possible=options.filter(canGo);if(!possible.length)return;
possible.sort((a,b)=>{const dist=d=>Math.min(...foods.map(f=>Math.abs(head.x+d.x-f.x)+Math.abs(head.y+d.y-f.y)));return dist(a)-dist(b)});const d=possible[rand(5)===0?rand(possible.length):0];s.next=d}
function update(){for(const s of snakes)if(!s.body.length&&s.respawn>0&&elapsed>=s.respawn)spawn(s);
for(const s of snakes.slice(1))if(s.body.length)chooseAI(s);
const movers=snakes.filter(s=>s.body.length).map(s=>{let d=s.next;if(!d||d.x===-s.dir.x&&d.y===-s.dir.y)d=s.dir;s.dir=d;s.next=null;return {s,head:{x:s.body[0].x+d.x,y:s.body[0].y+d.y},dead:false,killer:null}});
for(const m of movers){const h=m.head;if(h.x<0||h.x>=W||h.y<0||h.y>=H){m.dead=true;continue}
for(const other of snakes){const hit=other.body.some((p,i)=>equal(p,h)&&(!(other===m.s&&i===other.body.length-1)));if(hit){m.dead=true;m.killer=other===m.s?null:other;break}}
}
for(let a=0;a<movers.length;a++)for(let b=a+1;b<movers.length;b++)if(equal(movers[a].head,movers[b].head)){movers[a].dead=true;movers[b].dead=true}
for(const m of movers){const s=m.s;if(m.dead){if(elapsed<s.protected)continue;s.body=[];s.deaths++;s.score=Math.max(0,s.score-10);s.respawn=elapsed+2;if(m.killer){m.killer.score+=20}if(s===snakes[0])announce('💥 撞到了！2 秒后重生');continue}
s.body.unshift(m.head);const j=foods.findIndex(f=>equal(f,m.head));if(j>=0){foods.splice(j,1);s.score+=10;s.food++;if(s===snakes[0])announce('⭐ +10 分！再接再厉')}else{s.body.pop()}}
while(foods.length<FOODS)spawnFood();
refreshHud();
}
function refreshHud(){q('time').textContent=Math.max(0,ROUND-elapsed).toFixed(1)+'s';q('score').textContent=snakes[0]?.score||0;const sorted=[...snakes].sort((a,b)=>b.score-a.score||a.deaths-b.deaths);q('rank').textContent=sorted.indexOf(snakes[0])+1+' / '+snakes.length;q('leaders').innerHTML=sorted.map(s=>'<span class="scoreitem '+(s===snakes[0]?'you':'')+'"><i class="dot" style="background:'+s.color+'"></i>'+s.name+' '+s.score+'</span>').join('');if(elapsed>messageUntil)q('status').textContent=snakes[0]?.body.length?'🐍 继续吃豆，争取更高积分！':'💥 等待重生…'}
function finish(){running=false;cancelAnimationFrame(raf);const sorted=[...snakes].sort((a,b)=>b.score-a.score||a.deaths-b.deaths),me=snakes[0],rank=sorted.indexOf(me)+1;q('overlay').classList.remove('hidden');q('modal').innerHTML='<div class="mascot">'+(rank===1?'🏆':'🐍')+'</div><h1>60 秒挑战结束！</h1><p>你的排名：第 <b>'+rank+'</b> / 4 名<br>累计积分：<b>'+me.score+'</b> 分<br>吃到豆子：'+me.food+' 颗 · 碰撞：'+me.deaths+' 次</p><button class="action" id="start">↻ 再玩一次</button><small>本局为单机试玩，其他 3 条蛇由电脑控制。</small>';q('start').onclick=reset}

function draw(){
 const dpr=Math.min(2,window.devicePixelRatio||1),px=24*dpr,bw=W*px,bh=H*px;
 if(canvas.width!==bw||canvas.height!==bh){canvas.width=bw;canvas.height=bh}
 ctx.setTransform(px,0,0,px,0,0);
 const bg=ctx.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#0a1120');bg.addColorStop(.58,'#0a0d1b');bg.addColorStop(1,'#101126');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
 // Delicate hexagonal pattern instead of the harsh chessboard-style grid.
 ctx.save();ctx.lineWidth=.048;ctx.strokeStyle='#2d3d6750';const rx=2.25,ry=1.94;
 for(let row=-1;row<=Math.ceil(H/(ry*1.5));row++)for(let col=-1;col<=Math.ceil(W/(rx*1.75));col++){const x=col*rx*1.73+(row%2)*rx*.865,y=row*ry*1.5;ctx.beginPath();for(let i=0;i<6;i++){const a=i*Math.PI/3;const vx=x+rx*Math.cos(a),vy=y+ry*Math.sin(a);if(!i)ctx.moveTo(vx,vy);else ctx.lineTo(vx,vy)}ctx.closePath();ctx.stroke()}ctx.restore();
 // Bright, readable pellets (50% larger) with a restrained soft glow.
 const palette=['#ffe15b','#61ecff','#ff69dc','#b684ff'];
 for(let i=0;i<foods.length;i++){
  const f=foods[i],color=palette[(f.x*7+f.y*13+i)%palette.length],cx=f.x+.5,cy=f.y+.5;
  ctx.save();ctx.fillStyle=color;ctx.globalAlpha=.12;ctx.beginPath();ctx.arc(cx,cy,.83,0,Math.PI*2);ctx.fill();ctx.globalAlpha=.22;ctx.beginPath();ctx.arc(cx,cy,.62,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
  ctx.shadowBlur=0;ctx.fillStyle=color;ctx.beginPath();ctx.arc(cx,cy,.405,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fffdf2';ctx.globalAlpha=.73;ctx.beginPath();ctx.arc(cx-.14,cy-.14,.13,0,Math.PI*2);ctx.fill();ctx.restore();
 }
 for(const snake of snakes){
  if(!snake.body.length)continue;
  const s=snake,body=s.body,head=body[0],shield=running&&elapsed<s.protected;
  ctx.save();ctx.strokeStyle=s.color;ctx.lineCap='round';ctx.lineJoin='round';
  if(body.length>1){ctx.globalAlpha=.16;ctx.lineWidth=1.30;ctx.beginPath();for(let i=body.length-1;i>=0;i--){const p=body[i];if(i===body.length-1)ctx.moveTo(p.x+.5,p.y+.5);else ctx.lineTo(p.x+.5,p.y+.5)}ctx.stroke();ctx.globalAlpha=1;ctx.lineWidth=.78;ctx.stroke();}
  // Tapered individual round links eliminate visible right-angle square blocks.
  for(let i=body.length-1;i>=1;i--){const p=body[i],t=i/(body.length||1);ctx.globalAlpha=Math.max(.60,1-t*.23);ctx.fillStyle=s.color;ctx.beginPath();ctx.arc(p.x+.5,p.y+.5,.38,0,Math.PI*2);ctx.fill()}
  ctx.globalAlpha=1;ctx.fillStyle=s.color;ctx.beginPath();ctx.arc(head.x+.5,head.y+.5,.49,0,Math.PI*2);ctx.fill();
  if(shield){ctx.strokeStyle='#fff9fa';ctx.globalAlpha=.55;ctx.lineWidth=.065;ctx.beginPath();ctx.arc(head.x+.5,head.y+.5,.56,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1}
  // Distinctive face with expressive eyes facing movement direction.
  const eyeShiftX=s.dir.x*.14,eyeShiftY=s.dir.y*.14;
  const positions=s.dir.x!==0?[[.5+eyeShiftX,.33],[.5+eyeShiftX,.68]]:[[.34,.5+eyeShiftY],[.67,.5+eyeShiftY]];
  for(const [ex,ey]of positions){ctx.fillStyle='#ffffff';ctx.beginPath();ctx.arc(head.x+ex,head.y+ey,.135,0,Math.PI*2);ctx.fill();ctx.fillStyle='#182130';ctx.beginPath();ctx.arc(head.x+ex+s.dir.x*.05,head.y+ey+s.dir.y*.05,.071,0,Math.PI*2);ctx.fill()}
  // Tiny highlight adds gloss without harsh bloom.
  ctx.fillStyle='#ffffff';ctx.globalAlpha=.32;ctx.beginPath();ctx.arc(head.x+.32,head.y+.26,.10,0,Math.PI*2);ctx.fill();ctx.restore();
 }
 if(snakes[0]&&!snakes[0].body.length&&running){ctx.save();ctx.font='bold 1.05px system-ui';ctx.textAlign='center';ctx.shadowColor='#ff77ca';ctx.shadowBlur=.4;ctx.fillStyle='#ffd5ed';ctx.fillText('💥 2 秒后重生…',W/2,H/2);ctx.restore()}
}
function frame(ts){if(!running)return;let dt=Math.min(.08,Math.max(0,(ts-last)/1000));last=ts;elapsed+=dt;acc+=dt;while(acc>=STEP){acc-=STEP;update()}draw();if(elapsed>=ROUND){elapsed=ROUND;refreshHud();finish();return}raf=requestAnimationFrame(frame)}
function input(x,y){if(!running||!snakes[0]?.body.length)return;const s=snakes[0];if(x===-s.dir.x&&y===-s.dir.y)return;s.next={x,y}}
const buttonDirections={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
document.querySelectorAll('[data-dir]').forEach(button=>{button.addEventListener('pointerdown',e=>{e.preventDefault();input(...buttonDirections[button.dataset.dir]);button.classList.add('pressed')});for(const event of ['pointerup','pointercancel','pointerleave'])button.addEventListener(event,()=>button.classList.remove('pressed'));button.addEventListener('click',()=>input(...buttonDirections[button.dataset.dir]))});
document.addEventListener('keydown',e=>{const map={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]};if(map[e.key]){e.preventDefault();input(...map[e.key])}});
q('start').onclick=reset;q('restart').onclick=reset;snakes=colors.map((color,i)=>({name:names[i],color,body:[],score:0,deaths:0}));refreshHud();draw();
})();
</script></body></html>
